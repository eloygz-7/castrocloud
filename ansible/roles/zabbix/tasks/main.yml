# ct-zabbix: servidor Zabbix + web (Nginx e PHP-FPM) + MySQL.
# Os servidores dan de alta sós: o seu axente envía HostMetadata=castrocloud
# e unha acción de rexistro automático engádeos cos modelos de Linux e Docker.

- name: Directorio de Zabbix
  ansible.builtin.file:
    path: "{{ directorio_servizos }}/zabbix"
    state: directory
    mode: "0750"

- name: Segredos de Zabbix (.env, só para root)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ directorio_servizos }}/zabbix/.env"
    mode: "0600"

- name: Docker Compose de Zabbix
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ directorio_servizos }}/zabbix/compose.yml"
    mode: "0644"

- name: Arrancar Zabbix
  community.docker.docker_compose_v2:
    project_src: "{{ directorio_servizos }}/zabbix"
    pull: missing

- name: Configurar Zabbix pola súa API
  ansible.builtin.import_tasks: api.yml
