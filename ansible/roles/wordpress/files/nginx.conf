# CastroCloud · Nginx para WordPress con PHP-FPM
#   porto 80:  rede interna (HTTP, demo)
#   porto 443: HTTPS para editar desde fóra (o nodo publica só este porto,
#              scripts/publicar-web.sh), con límite de intentos de acceso

# Como moito 10 peticións por minuto e IP á páxina de acceso (contra a forza bruta)
limit_req_zone $binary_remote_addr zone=acceso:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    server_tokens off;
    # Redireccións relativas: detrás da redirección de portos, Nginx non
    # sabe o porto público e mandaría ao navegador ao seu (443)
    absolute_redirect off;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # Ficheiros que non se deben servir e XML-RPC (vía habitual de ataques)
    location ~ /\.(?:ht|git) { deny all; }
    location = /xmlrpc.php   { deny all; }
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/tls/web.crt;
    ssl_certificate_key /etc/nginx/tls/web.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name _;
    root /var/www/html;
    index index.php;
    server_tokens off;
    # Redireccións relativas: detrás da redirección de portos, Nginx non
    # sabe o porto público e mandaría ao navegador ao seu (443)
    absolute_redirect off;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location = /wp-login.php {
        limit_req zone=acceso burst=5 nodelay;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/wp-login.php;
        fastcgi_param HTTPS on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # Ficheiros que non se deben servir e XML-RPC (vía habitual de ataques)
    location ~ /\.(?:ht|git) { deny all; }
    location = /xmlrpc.php   { deny all; }
}
