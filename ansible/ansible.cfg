# CastroCloud · Configuración de Ansible (execútase desde esta carpeta, no equipo de Eloy)
[defaults]
inventory = inventario.ini
roles_path = roles
interpreter_python = /usr/bin/python3
# Laboratorio: os contedores recréanse a miúdo e cambian de clave de host.
# En produción: host_key_checking = True e known_hosts xestionado.
host_key_checking = False
retry_files_enabled = False

[ssh_connection]
pipelining = True
